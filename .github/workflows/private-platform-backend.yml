name: Private platform backend

on:
  push:
    branches:
      - private-platform-foundation
    paths:
      - "backend/**"
      - ".github/workflows/private-platform-backend.yml"
  pull_request:
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: backend/go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Format check
        run: |
          test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
