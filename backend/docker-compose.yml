services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: private_platform
      POSTGRES_USER: private_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U private_platform -d private_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build: .
    environment:
      HTTP_ADDR: :8080
      APP_ENV: production
      DATABASE_URL: postgres://private_platform:${POSTGRES_PASSWORD}@postgres:5432/private_platform?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
